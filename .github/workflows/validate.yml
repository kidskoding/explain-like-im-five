name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Symlinks resolve to AGENTS.md
        run: |
          set -e
          fail=0
          for link in CLAUDE.md GEMINI.md .clinerules .github/copilot-instructions.md; do
            if [ ! -L "$link" ]; then
              echo "::error file=$link::expected a symlink, got a regular file (drift risk)"; fail=1; continue
            fi
            if [ ! -e "$link" ]; then
              echo "::error file=$link::broken symlink — target missing"; fail=1; continue
            fi
            if ! cmp -s "$link" AGENTS.md; then
              echo "::error file=$link::symlink does not resolve to AGENTS.md content"; fail=1; continue
            fi
            echo "$link -> AGENTS.md OK"
          done
          exit $fail

      - name: plugin.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json')); print('plugin.json valid')"

      - name: marketplace.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json')); print('marketplace.json valid')"

      - name: Skill is in directory form (skills/<name>/SKILL.md)
        run: |
          set -e
          [ -f skills/eli5/SKILL.md ] || { echo "::error::skills/eli5/SKILL.md missing — plugin skills must be skills/<name>/SKILL.md"; exit 1; }
          # frontmatter must declare a name + description so the skill registers and auto-triggers
          grep -q '^name:' skills/eli5/SKILL.md || { echo "::error::SKILL.md missing 'name:' frontmatter"; exit 1; }
          grep -q '^description:' skills/eli5/SKILL.md || { echo "::error::SKILL.md missing 'description:' frontmatter"; exit 1; }
          # the shipped skill must point at the plugin-root AGENTS.md, not a sibling
          grep -q 'CLAUDE_PLUGIN_ROOT' skills/eli5/SKILL.md || { echo "::error::SKILL.md must reference \${CLAUDE_PLUGIN_ROOT}/AGENTS.md for plugin installs"; exit 1; }
          echo "skill shape OK"

      - name: Plugin ships no .claude/ directory (loader ignores it)
        run: |
          set -e
          if [ -e .claude ]; then
            echo "::error::.claude/ must not ship — the plugin loader reads skills/ at the root and ignores .claude/ (would double-register in project mode)"; exit 1
          fi
          echo "no .claude/ in repo"

      - name: No stray flat skill / colliding command
        run: |
          set -e
          [ -e skills/eli5.md ] && { echo "::error::flat skills/eli5.md is not discovered as a skill — use skills/eli5/SKILL.md"; exit 1; } || true
          [ -e commands/eli5.md ] && { echo "::error::legacy commands/eli5.md collides with the eli5 skill's /eli5 — remove it"; exit 1; } || true
          echo "no collisions"

      - name: Required files present
        run: |
          set -e
          for f in AGENTS.md LICENSE .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   skills/eli5/SKILL.md \
                   .codex/prompts/eli5.md .gemini/commands/eli5.toml \
                   .cursor/commands/eli5.md; do
            [ -e "$f" ] && echo "$f present" || { echo "::error file=$f::missing"; exit 1; }
          done
